<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10233f">
<link rel="manifest" href="manifest.json">
<title>Abordagens · GCM Matão</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213a;--mut:#5b6679;--navy:#10233f;--amb:#e8a317;--line:#d5dae3;--red:#b3261e;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b1424;--card:#142238;--ink:#e8edf5;--mut:#9aa7bd;--line:#26385a;--navy:#0a1730}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:14px 16px;border-bottom:4px solid var(--amb);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15rem}
header small{color:#c9d3e6}
main{max-width:760px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:80px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
button{font:inherit;border:0;border-radius:8px;padding:11px 14px;background:var(--amb);color:#1b1300;font-weight:700;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.del{background:var(--red);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amb);outline-offset:1px}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--amb);border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer}
.item b{font-size:1.05rem}.item div{color:var(--mut);font-size:.9rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.th{position:relative;width:92px;height:92px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.th button{position:absolute;top:-6px;right:-6px;padding:0;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;line-height:1}
.item{display:flex;gap:10px;align-items:flex-start}
.item img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px}
.st{font-size:.8rem;color:var(--mut);margin:6px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Abordagens · GCM Matão</h1><small id="st">Funciona sem internet · dados neste aparelho</small></header>
<main>
<section id="lista">
  <div class="bar"><input id="q" type="search" placeholder="Buscar por nome, apelido, CPF, local…" aria-label="Buscar"><button id="novo">Nova</button></div>
  <div class="st" id="cnt"></div>
  <div id="res"></div>
  <div class="foot">
    <button class="sec" id="expJ">Backup (JSON)</button>
    <button class="sec" id="expC">Exportar CSV</button>
    <button class="sec" id="impB">Restaurar backup</button>
    <input type="file" id="impF" accept=".json" hidden>
  </div>
</section>
<section id="form" hidden>
  <h2 id="ft">Nova abordagem</h2>
  <label for="nome">Nome completo *</label><input id="nome" autocomplete="off">
  <div class="row">
    <div><label for="apelido">Apelido / alcunha</label><input id="apelido"></div>
    <div><label for="nasc">Data de nascimento</label><input id="nasc" type="date"></div>
  </div>
  <div class="row">
    <div><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div>
    <div><label for="rg">RG</label><input id="rg"></div>
  </div>
  <label for="mae">Nome da mãe</label><input id="mae">
  <div class="row">
    <div><label for="tel">Telefone</label><input id="tel" type="tel"></div>
    <div><label for="tipo">Tipo</label><select id="tipo"><option>Pessoa</option><option>Veículo</option><option>Pessoa e veículo</option></select></div>
  </div>
  <label for="end">Endereço residencial</label><input id="end">
  <label for="placa">Placa / veículo</label><input id="placa" placeholder="ABC1D23 · modelo · cor">
  <div class="row">
    <div><label for="dt">Data e hora da abordagem</label><input id="dt" type="datetime-local"></div>
    <div><label for="local">Local da abordagem</label><input id="local"></div>
  </div>
  <label for="mot">Motivo</label><input id="mot">
  <label for="res2">Resultado</label>
  <select id="res2"><option>Liberado</option><option>Encaminhado à polícia</option><option>Orientado</option><option>Pendência / mandado verificado</option><option>Outro</option></select>
  <label for="vtr">VTR / equipe</label><input id="vtr">
  <label for="obs">Observações</label><textarea id="obs"></textarea>
  <label>Fotos (pessoa, documento, veículo, tatuagens…)</label>
  <div class="fotos" id="fotos"></div>
  <div class="acts"><button class="sec" id="addF" type="button">Adicionar foto</button></div>
  <input type="file" id="fileF" accept="image/*" multiple hidden>
  <div class="acts">
    <button id="salvar">Salvar</button>
    <button class="sec" id="cancel">Cancelar</button>
    <button class="del" id="excl" hidden>Excluir</button>
  </div>
</section>
</main>
<div class="lb" id="lb" hidden><button id="lbx">Fechar</button><img id="lbi" alt="Foto ampliada"></div>
<script>
const DB='gcm_abordagens',S='abordagens',ids='nome apelido nasc cpf rg mae tel tipo end placa dt local mot res2 vtr obs'.split(' ');
let db,cur=null,all=[],fotos=[];
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function open(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(S,{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const tx=(m,f)=>new Promise((ok,no)=>{const t=db.transaction(S,m),o=f(t.objectStore(S));t.oncomplete=()=>ok(o&&o.result);t.onerror=()=>no(t.error)});
const load=async()=>{all=(await tx('readonly',s=>s.getAll())).sort((a,b)=>(b.dt||'').localeCompare(a.dt||''));render()};
function fmt(d){if(!d)return'sem data';const x=new Date(d);return isNaN(x)?d:x.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function render(){
  const q=norm($('q').value),qd=q.replace(/\D/g,'');
  const l=all.filter(r=>!q||norm([r.nome,r.apelido,r.mae,r.local,r.placa,r.mot].join(' ')).includes(q)||(qd&&(r.cpf||'').replace(/\D/g,'').includes(qd)));
  $('cnt').textContent=l.length+' de '+all.length+' registro(s)';
  $('res').innerHTML=l.length?l.map(r=>`<div class="item" tabindex="0" role="button" data-id="${esc(r.id)}">${r.fotos&&r.fotos[0]?'<img alt="" src="'+esc(r.fotos[0])+'">':''}<span><b>${esc(r.nome)}</b>${r.apelido?' ("'+esc(r.apelido)+'")':''}<div>${esc(fmt(r.dt))} · ${esc(r.local||'local não informado')}</div><div>${esc(r.mot||'')}${r.res2?' → '+esc(r.res2):''}</div></span></div>`).join(''):'<div class="empty">Nenhum registro. Toque em Nova para cadastrar a primeira abordagem.</div>';
}
function show(f){$('form').hidden=!f;$('lista').hidden=f;scrollTo(0,0)}
function edit(r){
  cur=r||null;$('ft').textContent=r?'Editar abordagem':'Nova abordagem';$('excl').hidden=!r;
  ids.forEach(i=>$(i).value=r?r[i]||'':'');
  fotos=r&&r.fotos?r.fotos.slice():[];renderF();
  if(!r){const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());$('dt').value=n.toISOString().slice(0,16)}
  show(true);
}
async function salvar(){
  const o={};ids.forEach(i=>o[i]=$(i).value.trim());
  if(!o.nome){alert('Informe o nome.');$('nome').focus();return}
  o.fotos=fotos;o.id=cur?cur.id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));
  o.criado=cur?cur.criado:new Date().toISOString();o.alterado=new Date().toISOString();
  await tx('readwrite',s=>s.put(o));show(false);load();
}
function renderF(){
  $('fotos').innerHTML=fotos.map((f,i)=>`<div class="th"><img src="${esc(f)}" alt="Foto ${i+1}" data-i="${i}"><button type="button" aria-label="Remover foto ${i+1}" data-r="${i}">×</button></div>`).join('');
}
function comprimir(file,max=1000,q=.72){return new Promise((ok,no)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
$('addF').onclick=()=>$('fileF').click();
$('fileF').onchange=async e=>{
  let falhou=0;
  for(const f of e.target.files){try{fotos.push(await comprimir(f))}catch{falhou++}}
  e.target.value='';renderF();
  if(falhou)alert(falhou+' arquivo(s) não puderam ser lidos como imagem.');
};
$('fotos').addEventListener('click',e=>{
  const r=e.target.closest('[data-r]');
  if(r){fotos.splice(+r.dataset.r,1);renderF();return}
  const i=e.target.closest('img[data-i]');
  if(i){$('lbi').src=fotos[+i.dataset.i];$('lb').hidden=false}
});
$('lb').onclick=()=>{$('lb').hidden=true;$('lbi').removeAttribute('src')};
function baixar(nome,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const hoje=()=>new Date().toISOString().slice(0,10);
$('cpf').addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')});
$('q').addEventListener('input',render);
$('novo').onclick=()=>edit(null);
$('cancel').onclick=()=>show(false);
$('salvar').onclick=salvar;
$('excl').onclick=async()=>{if(cur&&confirm('Excluir este registro? Não dá para desfazer.')){await tx('readwrite',s=>s.delete(cur.id));show(false);load()}};
$('res').addEventListener('click',e=>{const el=e.target.closest('.item');if(el)edit(all.find(r=>r.id===el.dataset.id))});
$('res').addEventListener('keydown',e=>{if(e.key==='Enter'){const el=e.target.closest('.item');if(el)edit(all.find(r=>r.id===el.dataset.id))}});
$('expJ').onclick=()=>baixar('backup-abordagens-'+hoje()+'.json',JSON.stringify(all),'application/json');
$('expC').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';baixar('abordagens-'+hoje()+'.csv','\ufeff'+[ids.join(';')].concat(all.map(r=>ids.map(i=>q(r[i])).join(';'))).join('\n'),'text/csv')};
$('impB').onclick=()=>$('impF').click();
$('impF').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw 0;
    if(!confirm('Importar '+d.length+' registro(s)? Registros com mesmo ID serão substituídos.'))return;
    await tx('readwrite',s=>{d.forEach(r=>r&&r.id&&r.nome&&s.put(r))});load()}
  catch{alert('Arquivo de backup inválido.')}
  e.target.value='';
};
function net(){$('st').textContent=(navigator.onLine?'Online':'Offline')+' · dados guardados neste aparelho'}
addEventListener('online',net);addEventListener('offline',net);net();
open().then(d=>{db=d;load()}).catch(()=>{$('res').innerHTML='<div class="empty">Não foi possível abrir o banco local. Saia do modo anônimo do navegador.</div>'});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
